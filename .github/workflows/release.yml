name: Release

# Triggered automatically when a version tag is pushed (e.g. v0.3.0).
# This workflow:
#   1. Re-uses the Build workflow via workflow_call to produce all bundles.
#   2. Generates a CHANGELOG from git log since the previous tag.
#   3. Creates a signed GitHub Release with all bundles attached.
#
# How to release:
#   git tag -a v0.3.0 -m "Release v0.3.0"
#   git push origin v0.3.0
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"        # e.g. v1.2.3
      - "v[0-9]+.[0-9]+.[0-9]+-*"      # e.g. v1.2.3-rc.1
      - "[0-9]+.[0-9]+.[0-9]+"         # e.g. 0.3.24
      - "[0-9]+.[0-9]+.[0-9]+-*"       # e.g. 0.3.24-rc.1
      - "v*"

  # Allow triggering a release manually from the Actions tab.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist, e.g. v0.3.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ────────────────────────────────────────────────────────────────
  # 1. Build all platform bundles
  # ────────────────────────────────────────────────────────────────
  build-linux:
    name: Build — Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libhunspell-dev \
            libclang-dev clang llvm \
            rpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall --no-confirm tauri-cli@^2

      - name: Sync version from tag
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const v = process.argv[1].replace(/^v/, "");
            if (/^\d+\.\d+\.\d+/.test(v)) {
              let c = fs.readFileSync("src-tauri/Cargo.toml", "utf8").replace(/^version = ".*?"/m, `version = "${v}"`);
              fs.writeFileSync("src-tauri/Cargo.toml", c);
              let t = fs.readFileSync("src-tauri/tauri.conf.json", "utf8").replace(/"version": ".*?"/, `"version": "${v}"`);
              fs.writeFileSync("src-tauri/tauri.conf.json", t);
              console.log("✓ Synced version to " + v);
            }
          ' "${{ github.event.inputs.tag || github.ref_name }}"

      - name: Build bundles
        working-directory: src-tauri
        shell: bash
        run: |
          export LIBCLANG_PATH=$(llvm-config --libdir)
          export LD_LIBRARY_PATH=$(llvm-config --libdir):$LD_LIBRARY_PATH
          echo "LIBCLANG_PATH: $LIBCLANG_PATH"
          IS_VALID_KEY=true
          if [ -n "$SIGNING_KEY" ]; then
            if echo "$SIGNING_KEY" | base64 -d 2>/dev/null | grep -qi "public key"; then
              echo "::warning::TAURI_SIGNING_PRIVATE_KEY appears to be a PUBLIC key (*.key.pub), not a PRIVATE key (*.key)! Please update the secret in GitHub repository settings."
              IS_VALID_KEY=false
            else
              echo "test" > __test_key.txt
              if ! cargo tauri signer sign --private-key "$SIGNING_KEY" --password "${SIGNING_KEY_PWD:-}" __test_key.txt >/dev/null 2>&1; then
                echo "::warning::TAURI_SIGNING_PRIVATE_KEY could not be decrypted with TAURI_SIGNING_PRIVATE_KEY_PASSWORD (wrong key or password). Please update your GitHub repository secrets! Building unsigned bundles..."
                IS_VALID_KEY=false
              fi
              rm -f __test_key.txt __test_key.txt.sig
            fi
          else
            IS_VALID_KEY=false
          fi

          if [ "$IS_VALID_KEY" = "true" ]; then
            export TAURI_SIGNING_PRIVATE_KEY="$SIGNING_KEY"
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$SIGNING_KEY_PWD"
            if ! cargo tauri build --target x86_64-unknown-linux-gnu; then
              echo "::warning::Tauri signed build failed. Falling back to unsigned build..."
              unset TAURI_SIGNING_PRIVATE_KEY
              unset TAURI_SIGNING_PRIVATE_KEY_PASSWORD
              cargo tauri build --target x86_64-unknown-linux-gnu --config '{"bundle":{"createUpdaterArtifacts":false},"plugins":{"updater":{"pubkey":""}}}'
            fi
          else
            echo "Building unsigned bundles (valid SIGNING_KEY not configured)..."
            cargo tauri build --target x86_64-unknown-linux-gnu --config '{"bundle":{"createUpdaterArtifacts":false},"plugins":{"updater":{"pubkey":""}}}'
          fi
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_KEY_PWD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Stage bundles
        run: |
          mkdir -p staging
          while IFS= read -r -d '' deb; do
            echo "Sanitizing Debian package $deb (removing duplicate desktop file)..."
            tmp_extract=$(mktemp -d)
            dpkg-deb -R "$deb" "$tmp_extract"
            rm -f "$tmp_extract/usr/share/applications/Notion Lite.desktop"
            dpkg-deb -b "$tmp_extract" "$deb"
            rm -rf "$tmp_extract"
          done < <(find src-tauri/target/x86_64-unknown-linux-gnu/release/bundle -name "*.deb" -print0 2>/dev/null)
          # Rename to static names for permanent README links.
          # Updater signatures must be renamed alongside their artifacts.
          copy_artifact() {
            pattern="$1"
            dest="$2"
            src=$(find src-tauri/target/x86_64-unknown-linux-gnu/release/bundle -name "$pattern" -print | head -n 1)
            if [ -n "$src" ]; then
              cp "$src" "staging/$dest"
              if [ -f "${src}.sig" ]; then
                cp "${src}.sig" "staging/$dest.sig"
              fi
            fi
          }
          copy_artifact "*.deb" "notion-lite_amd64.deb"
          copy_artifact "*.rpm" "notion-lite.rpm"
          copy_artifact "*.AppImage" "notion-lite.AppImage"
          copy_artifact "*.AppImage.tar.gz" "notion-lite.AppImage.tar.gz"
          ls -lh staging/

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-linux-x86_64
          path: staging/
          if-no-files-found: error

  build-macos-x64:
    name: Build — macOS x86_64 (Intel)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install macOS system dependencies
        run: brew install hunspell llvm

      - name: Locate libclang (macOS)
        run: |
          LLVM_LIB_DIR="$(brew --prefix llvm)/lib"
          echo "LLVM_LIB_DIR: $LLVM_LIB_DIR"
          ls -l "$LLVM_LIB_DIR/libclang.dylib"
          # Symlink to /usr/local/lib which is usually searched by dyld
          sudo mkdir -p /usr/local/lib
          sudo ln -sf "$LLVM_LIB_DIR/libclang.dylib" /usr/local/lib/libclang.dylib

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall --no-confirm tauri-cli@^2

      - name: Sync version from tag
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const v = process.argv[1].replace(/^v/, "");
            if (/^\d+\.\d+\.\d+/.test(v)) {
              let c = fs.readFileSync("src-tauri/Cargo.toml", "utf8").replace(/^version = ".*?"/m, `version = "${v}"`);
              fs.writeFileSync("src-tauri/Cargo.toml", c);
              let t = fs.readFileSync("src-tauri/tauri.conf.json", "utf8").replace(/"version": ".*?"/, `"version": "${v}"`);
              fs.writeFileSync("src-tauri/tauri.conf.json", t);
              console.log("✓ Synced version to " + v);
            }
          ' "${{ github.event.inputs.tag || github.ref_name }}"

      - name: Build bundles
        working-directory: src-tauri
        shell: bash
        run: |
          export SDKROOT=$(xcrun --show-sdk-path)
          export LIBCLANG_PATH="$(brew --prefix llvm)/lib"
          echo "LIBCLANG_PATH: $LIBCLANG_PATH"
          IS_VALID_KEY=true
          if [ -n "$SIGNING_KEY" ]; then
            if echo "$SIGNING_KEY" | base64 -d 2>/dev/null | grep -qi "public key"; then
              echo "::warning::TAURI_SIGNING_PRIVATE_KEY appears to be a PUBLIC key (*.key.pub), not a PRIVATE key (*.key)! Please update the secret in GitHub repository settings."
              IS_VALID_KEY=false
            else
              echo "test" > __test_key.txt
              if ! cargo tauri signer sign --private-key "$SIGNING_KEY" --password "${SIGNING_KEY_PWD:-}" __test_key.txt >/dev/null 2>&1; then
                echo "::warning::TAURI_SIGNING_PRIVATE_KEY could not be decrypted with TAURI_SIGNING_PRIVATE_KEY_PASSWORD (wrong key or password). Please update your GitHub repository secrets! Building unsigned bundles..."
                IS_VALID_KEY=false
              fi
              rm -f __test_key.txt __test_key.txt.sig
            fi
          else
            IS_VALID_KEY=false
          fi

          if [ "$IS_VALID_KEY" = "true" ]; then
            export TAURI_SIGNING_PRIVATE_KEY="$SIGNING_KEY"
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$SIGNING_KEY_PWD"
            if ! cargo tauri build --target x86_64-apple-darwin; then
              echo "::warning::Tauri signed build failed. Falling back to unsigned build..."
              unset TAURI_SIGNING_PRIVATE_KEY
              unset TAURI_SIGNING_PRIVATE_KEY_PASSWORD
              cargo tauri build --target x86_64-apple-darwin --config '{"bundle":{"createUpdaterArtifacts":false},"plugins":{"updater":{"pubkey":""}}}'
            fi
          else
            echo "Building unsigned bundles (valid SIGNING_KEY not configured)..."
            cargo tauri build --target x86_64-apple-darwin --config '{"bundle":{"createUpdaterArtifacts":false},"plugins":{"updater":{"pubkey":""}}}'
          fi
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_KEY_PWD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Stage bundles
        run: |
          mkdir -p staging
          copy_artifact() {
            pattern="$1"
            dest="$2"
            src=$(find src-tauri/target/x86_64-apple-darwin/release/bundle -name "$pattern" -print | head -n 1)
            if [ -n "$src" ]; then
              cp "$src" "staging/$dest"
              if [ -f "${src}.sig" ]; then
                cp "${src}.sig" "staging/$dest.sig"
              fi
            fi
          }
          copy_artifact "*.dmg" "notion-lite-x64.dmg"
          copy_artifact "*.app.tar.gz" "notion-lite-macos-x64.app.tar.gz"
          ls -lh staging/

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-macos-x86_64
          path: staging/
          if-no-files-found: error

