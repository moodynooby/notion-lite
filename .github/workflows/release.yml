  build-windows:
    name: Build — Windows x86_64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Windows system dependencies
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files\LLVM\bin\libclang.dll") {
            echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          } elseif (Test-Path "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64\bin\libclang.dll") {
            echo "LIBCLANG_PATH=C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64\bin" >> $env:GITHUB_ENV
          } else {
            choco install llvm --no-progress
            echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall --no-confirm tauri-cli@^2

      - name: Sync version from tag
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const v = process.argv[1].replace(/^v/, "");
            if (/^\d+\.\d+\.\d+/.test(v)) {
              let c = fs.readFileSync("src-tauri/Cargo.toml", "utf8").replace(/^version = ".*?"/m, `version = "${v}"`);
              fs.writeFileSync("src-tauri/Cargo.toml", c);
              let t = fs.readFileSync("src-tauri/tauri.conf.json", "utf8").replace(/"version": ".*?"/, `"version": "${v}"`);
              fs.writeFileSync("src-tauri/tauri.conf.json", t);
              console.log("✓ Synced version to " + v);
            }
          ' "${{ github.event.inputs.tag || github.ref_name }}"

      - name: Build bundles
        working-directory: src-tauri
        shell: bash
        run: |
          if [ -z "$LIBCLANG_PATH" ]; then
            if [ -f "C:/Program Files/LLVM/bin/libclang.dll" ]; then
              export LIBCLANG_PATH="C:/Program Files/LLVM/bin"
            elif [ -f "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Tools/Llvm/x64/bin/libclang.dll" ]; then
              export LIBCLANG_PATH="C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Tools/Llvm/x64/bin"
            fi
          fi
          echo "LIBCLANG_PATH: $LIBCLANG_PATH"
          IS_VALID_KEY=true
          if [ -n "$SIGNING_KEY" ]; then
            if echo "$SIGNING_KEY" | base64 -d 2>/dev/null | grep -qi "public key"; then
              echo "::warning::TAURI_SIGNING_PRIVATE_KEY appears to be a PUBLIC key (*.key.pub), not a PRIVATE key (*.key)! Please update the secret in GitHub repository settings."
              IS_VALID_KEY=false
            else
              echo "test" > __test_key.txt
              if ! cargo tauri signer sign --private-key "$SIGNING_KEY" --password "${SIGNING_KEY_PWD:-}" __test_key.txt >/dev/null 2>&1; then
                echo "::warning::TAURI_SIGNING_PRIVATE_KEY could not be decrypted with TAURI_SIGNING_PRIVATE_KEY_PASSWORD (wrong key or password). Please update your GitHub repository secrets! Building unsigned bundles..."
                IS_VALID_KEY=false
              fi
              rm -f __test_key.txt __test_key.txt.sig
            fi
          else
            IS_VALID_KEY=false
          fi

          if [ "$IS_VALID_KEY" = "true" ]; then
            export TAURI_SIGNING_PRIVATE_KEY="$SIGNING_KEY"
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$SIGNING_KEY_PWD"
            if ! cargo tauri build --target x86_64-pc-windows-msvc; then
              echo "::warning::Tauri signed build failed. Falling back to unsigned build..."
              unset TAURI_SIGNING_PRIVATE_KEY
              unset TAURI_SIGNING_PRIVATE_KEY_PASSWORD
              cargo tauri build --target x86_64-pc-windows-msvc --config '{"bundle":{"createUpdaterArtifacts":false},"plugins":{"updater":{"pubkey":""}}}'
            fi
          else
            echo "Building unsigned bundles (valid SIGNING_KEY not configured)..."
            cargo tauri build --target x86_64-pc-windows-msvc --config '{"bundle":{"createUpdaterArtifacts":false},"plugins":{"updater":{"pubkey":""}}}'
          fi
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_KEY_PWD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Stage bundles
        shell: bash
        run: |
          mkdir -p staging
          copy_artifact() {
            pattern="$1"
            dest="$2"
            src=$(find src-tauri/target/x86_64-pc-windows-msvc/release/bundle -name "$pattern" -print | head -n 1)
            if [ -n "$src" ]; then
              cp "$src" "staging/$dest"
              if [ -f "${src}.sig" ]; then
                cp "${src}.sig" "staging/$dest.sig"
              fi
            fi
          }
          copy_artifact "*.exe" "notion-lite-setup.exe"
          copy_artifact "*.zip" "notion-lite-setup.zip"
          ls -lh staging/

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-windows-x86_64
          path: staging/
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────
  # 2. Generate CHANGELOG and publish the GitHub Release
  # ────────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [build-linux, build-macos-x64, build-macos-arm64, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout (full history for changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate CHANGELOG since last release
        id: changelog
        run: |
          TAG="${{ steps.tag.outputs.version }}"
          # Find the previous tag (if any)
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1 || true)

          echo "## What's Changed in ${TAG}" > CHANGELOG_RELEASE.md
          echo "" >> CHANGELOG_RELEASE.md

          if [ -n "$PREV_TAG" ]; then
            echo "Full diff: [\`${PREV_TAG}...${TAG}\`](../../compare/${PREV_TAG}...${TAG})" >> CHANGELOG_RELEASE.md
            echo "" >> CHANGELOG_RELEASE.md

            # Categorise commits by conventional commit prefix
            for prefix in feat fix perf refactor docs chore; do
              commits=$(git log "${PREV_TAG}..HEAD" \
                --pretty=format:"- %s ([%h](../../commit/%H))" \
                --no-merges \
                | grep -i "^- ${prefix}" || true)
              if [ -n "$commits" ]; then
                case $prefix in
                  feat)     echo "### ✨ New Features" >> CHANGELOG_RELEASE.md ;;
                  fix)      echo "### 🐛 Bug Fixes"   >> CHANGELOG_RELEASE.md ;;
                  perf)     echo "### ⚡ Performance"  >> CHANGELOG_RELEASE.md ;;
                  refactor) echo "### ♻️ Refactor"     >> CHANGELOG_RELEASE.md ;;
                  docs)     echo "### 📚 Docs"         >> CHANGELOG_RELEASE.md ;;
                  chore)    echo "### 🔧 Chores"       >> CHANGELOG_RELEASE.md ;;
                esac
                echo "$commits" >> CHANGELOG_RELEASE.md
                echo "" >> CHANGELOG_RELEASE.md
              fi
            done

            # Remainder (uncategorised)
            OTHER=$(git log "${PREV_TAG}..HEAD" \
              --pretty=format:"- %s ([%h](../../commit/%H))" \
              --no-merges \
              | grep -viE "^- (feat|fix|perf|refactor|docs|chore)" || true)
            if [ -n "$OTHER" ]; then
              echo "### 📦 Other" >> CHANGELOG_RELEASE.md
              echo "$OTHER" >> CHANGELOG_RELEASE.md
              echo "" >> CHANGELOG_RELEASE.md
            fi
          else
            echo "_Initial release — no previous tag found._" >> CHANGELOG_RELEASE.md
            echo "" >> CHANGELOG_RELEASE.md
          fi

          echo "### 📥 Installation" >> CHANGELOG_RELEASE.md
          echo "" >> CHANGELOG_RELEASE.md
          echo "| Platform | Package |" >> CHANGELOG_RELEASE.md
          echo "|---|---|" >> CHANGELOG_RELEASE.md
          echo "| Ubuntu / Debian | \`.deb\` |" >> CHANGELOG_RELEASE.md
          echo "| Fedora / RHEL | \`.rpm\` |" >> CHANGELOG_RELEASE.md
          echo "| Any Linux (portable) | \`.AppImage\` |" >> CHANGELOG_RELEASE.md
          echo "| macOS (Intel) | \`.dmg\` (x86_64) |" >> CHANGELOG_RELEASE.md
          echo "| macOS (Apple Silicon) | \`.dmg\` (aarch64) |" >> CHANGELOG_RELEASE.md
          echo "| Windows | \`.exe\` (x64) |" >> CHANGELOG_RELEASE.md
          echo "" >> CHANGELOG_RELEASE.md
          echo "> ⚠️ This is an unofficial Notion client. Not affiliated with or endorsed by Notion Labs, Inc." >> CHANGELOG_RELEASE.md

          cat CHANGELOG_RELEASE.md

      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          path: release-assets/
          # Download all artifacts from this workflow run
          merge-multiple: true

      - name: List release assets
        run: find release-assets/ -type f | sort

      - name: Import APT signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$APT_GPG_PRIVATE_KEY" ]; then
            printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          else
            echo "::warning::APT_GPG_PRIVATE_KEY is not configured; the APT repository will be unsigned."
          fi

      # Build compliant Debian/Ubuntu APT repository according to apt-packaging-guide.md
      - name: Build APT Repository
        env:
          GPG_KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}
        run: |
          sudo apt-get update && sudo apt-get install -y dpkg-dev
          mkdir -p dist
          find release-assets -name "*.deb" -exec cp {} dist/ \;
          ./scripts/update-repo.sh apt-repo
          tar -czf release-assets/apt-repo.tar.gz -C apt-repo .
          cp scripts/setup.sh release-assets/

      - name: Prepare GitHub Pages artifact
        run: |
          mkdir -p pages-site
          cp -a apt-repo pages-site/apt-repo

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site

      # Generate SHA-256 checksums for all assets
      - name: Generate SHA-256 checksums
        run: |
          cd release-assets
          find . -maxdepth 1 -type f ! -name "SHA256SUMS.txt" -exec sha256sum {} + | sed 's|  \./|  |' | sort -k 2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Generate latest.json for Tauri Updater
      - name: Generate latest.json
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          VERSION_CLEAN="${VERSION#v}"
          REPO_URL="https://github.com/${{ github.repository }}/releases/download/${VERSION}"
          
          # Find assets (AppImage for Linux, .app.tar.gz for macOS, .exe for Windows)
          LINUX_ASSET=$(find release-assets -name "*.AppImage" -printf "%f\n" | head -1)
          MACOS_X64_ASSET=$(find release-assets -name "*macos-x64.app.tar.gz" -printf "%f\n" | head -1)
          MACOS_ARM_ASSET=$(find release-assets -name "*macos-arm64.app.tar.gz" -printf "%f\n" | head -1)
          WINDOWS_ASSET=$(find release-assets -name "*.exe" -printf "%f\n" | head -1)
          WINDOWS_ZIP=$(find release-assets -name "*.zip" -printf "%f\n" | head -1)
          if [ -n "$WINDOWS_ZIP" ] && [ -f "release-assets/$WINDOWS_ZIP.sig" ]; then
            WINDOWS_ASSET="$WINDOWS_ZIP"
          fi

          get_sig() {
            cat "release-assets/$1.sig"
          }

          # Never publish updater metadata for unsigned artifacts: Tauri will
          # reject the update and leave users stuck on an older version.
          MISSING_SIGNATURES=0
          for asset in "$LINUX_ASSET" "$MACOS_X64_ASSET" "$MACOS_ARM_ASSET" "$WINDOWS_ASSET"; do
            if [ -z "$asset" ] || [ ! -f "release-assets/$asset.sig" ]; then
              echo "::warning::Missing updater signature for '${asset:-unknown asset}'"
              MISSING_SIGNATURES=1
            fi
          done
          if [ "$MISSING_SIGNATURES" -ne 0 ]; then
            echo "::warning::Skipping latest.json because the updater artifacts are not fully signed."
            rm -f release-assets/latest.json
            exit 0
          fi

          cat <<EOF > release-assets/latest.json
          {
            "version": "$VERSION_CLEAN",
            "notes": "Security hardening and updater integration.",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "linux-x86_64": {
                "signature": "$(get_sig "$LINUX_ASSET")",
                "url": "$REPO_URL/$LINUX_ASSET"
              },
              "darwin-x86_64": {
                "signature": "$(get_sig "$MACOS_X64_ASSET")",
                "url": "$REPO_URL/$MACOS_X64_ASSET"
              },
              "darwin-aarch64": {
                "signature": "$(get_sig "$MACOS_ARM_ASSET")",
                "url": "$REPO_URL/$MACOS_ARM_ASSET"
              },
              "windows-x86_64": {
                "signature": "$(get_sig "$WINDOWS_ASSET")",
                "url": "$REPO_URL/$WINDOWS_ASSET"
              }
            }
          }
          EOF
          cat release-assets/latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: "Notion Lite ${{ steps.tag.outputs.version }}"
          body_path: CHANGELOG_RELEASE.md
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.version, '-') }}
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ────────────────────────────────────────────────────────────────
  # 3. Deploy the APT repository to GitHub Pages
  # ────────────────────────────────────────────────────────────────
  deploy-pages:
    name: Deploy APT repository to GitHub Pages
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
