name: Release

# Triggered automatically when a version tag is pushed (e.g. v0.3.0).
# This workflow:
#   1. Re-uses the Build workflow via workflow_call to produce all bundles.
#   2. Generates a CHANGELOG from git log since the previous tag.
#   3. Creates a signed GitHub Release with all bundles attached.
#
# How to release:
#   git tag -a v0.3.0 -m "Release v0.3.0"
#   git push origin v0.3.0
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"        # e.g. v1.2.3
      - "v[0-9]+.[0-9]+.[0-9]+-*"      # e.g. v1.2.3-rc.1
      - "[0-9]+.[0-9]+.[0-9]+"         # e.g. 0.3.24
      - "[0-9]+.[0-9]+.[0-9]+-*"       # e.g. 0.3.24-rc.1
      - "v*"

  # Allow triggering a release manually from the Actions tab.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist, e.g. v0.3.0)"
        required: true

permissions:
  contents: write   # needed to create the GitHub Release

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ────────────────────────────────────────────────────────────────
  # 1. Build all platform bundles
  # ────────────────────────────────────────────────────────────────
  build-linux:
    name: Build — Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libhunspell-dev \
            libclang-dev clang llvm \
            rpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rel-linux-x86_64-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rel-linux-x86_64-

      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall --no-confirm tauri-cli@^2

      - name: Build bundles
        working-directory: src-tauri
        run: |
          export LIBCLANG_PATH=$(llvm-config --libdir)
          export LD_LIBRARY_PATH=$(llvm-config --libdir):$LD_LIBRARY_PATH
          echo "LIBCLANG_PATH: $LIBCLANG_PATH"
          if [ -n "$SIGNING_KEY" ]; then
            export TAURI_SIGNING_PRIVATE_KEY="$SIGNING_KEY"
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$SIGNING_KEY_PWD"
            cargo tauri build --target x86_64-unknown-linux-gnu
          else
            echo "Building unsigned bundles (SIGNING_KEY not set in secrets)..."
            cargo tauri build --target x86_64-unknown-linux-gnu --config '{"bundle":{"createUpdaterArtifacts":false},"plugins":{"updater":{"pubkey":""}}}'
          fi
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_KEY_PWD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Stage bundles
        run: |
          mkdir -p staging
          # Rename to static names for permanent README links
          find src-tauri/target/x86_64-unknown-linux-gnu/release/bundle -name "*.deb" -exec cp {} staging/notion-lite_amd64.deb \;
          find src-tauri/target/x86_64-unknown-linux-gnu/release/bundle -name "*.rpm" -exec cp {} staging/notion-lite.rpm \;
          find src-tauri/target/x86_64-unknown-linux-gnu/release/bundle -name "*.AppImage" -exec cp {} staging/notion-lite.AppImage \;
          find src-tauri/target/x86_64-unknown-linux-gnu/release/bundle -name "*.sig" -exec cp {} staging/ \; || true
          find src-tauri/target/x86_64-unknown-linux-gnu/release/bundle -name "*.tar.gz*" -exec cp {} staging/ \; || true
          ls -lh staging/

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-linux-x86_64
          path: staging/
          if-no-files-found: error

  build-macos-x64:
    name: Build — macOS x86_64 (Intel)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install macOS system dependencies
        run: brew install hunspell llvm

      - name: Locate libclang (macOS)
        run: |
          LLVM_LIB_DIR="$(brew --prefix llvm)/lib"
          echo "LLVM_LIB_DIR: $LLVM_LIB_DIR"
          ls -l "$LLVM_LIB_DIR/libclang.dylib"
          # Symlink to /usr/local/lib which is usually searched by dyld
          sudo mkdir -p /usr/local/lib
          sudo ln -sf "$LLVM_LIB_DIR/libclang.dylib" /usr/local/lib/libclang.dylib

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rel-macos-x86_64-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rel-macos-x86_64-

      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall --no-confirm tauri-cli@^2

      - name: Build bundles
        working-directory: src-tauri
        run: |
          export SDKROOT=$(xcrun --show-sdk-path)
          export LIBCLANG_PATH="$(brew --prefix llvm)/lib"
          echo "LIBCLANG_PATH: $LIBCLANG_PATH"
          ls -la "$LIBCLANG_PATH" | head -20
          if [ -n "$SIGNING_KEY" ]; then
            export TAURI_SIGNING_PRIVATE_KEY="$SIGNING_KEY"
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$SIGNING_KEY_PWD"
            cargo tauri build --target x86_64-apple-darwin
          else
            echo "Building unsigned bundles (SIGNING_KEY not set in secrets)..."
            cargo tauri build --target x86_64-apple-darwin --config '{"bundle":{"createUpdaterArtifacts":false},"plugins":{"updater":{"pubkey":""}}}'
          fi
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_KEY_PWD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Stage bundles
        run: |
          mkdir -p staging
          find src-tauri/target/x86_64-apple-darwin/release/bundle -name "*.dmg" -exec cp {} staging/notion-lite-x64.dmg \;
          find src-tauri/target/x86_64-apple-darwin/release/bundle -name "*.app.tar.gz" -exec cp {} staging/notion-lite-macos-x64.app.tar.gz \;
          find src-tauri/target/x86_64-apple-darwin/release/bundle -name "*.sig" -exec cp {} staging/ \; || true
          ls -lh staging/

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-macos-x86_64
          path: staging/
          if-no-files-found: error

  build-macos-arm64:
    name: Build — macOS aarch64 (Apple Silicon)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install macOS system dependencies
        run: brew install hunspell llvm

      - name: Locate libclang (macOS)
        run: |
          LLVM_LIB_DIR="$(brew --prefix llvm)/lib"
          echo "LLVM_LIB_DIR: $LLVM_LIB_DIR"
          ls -l "$LLVM_LIB_DIR/libclang.dylib"
          # Symlink to /usr/local/lib which is usually searched by dyld
          sudo mkdir -p /usr/local/lib
          sudo ln -sf "$LLVM_LIB_DIR/libclang.dylib" /usr/local/lib/libclang.dylib

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rel-macos-aarch64-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rel-macos-aarch64-

      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall --no-confirm tauri-cli@^2

      - name: Build bundles
        working-directory: src-tauri
        run: |
          export SDKROOT=$(xcrun --show-sdk-path)
          export LIBCLANG_PATH="$(brew --prefix llvm)/lib"
          echo "LIBCLANG_PATH: $LIBCLANG_PATH"
          ls -la "$LIBCLANG_PATH" | head -20
          if [ -n "$SIGNING_KEY" ]; then
            export TAURI_SIGNING_PRIVATE_KEY="$SIGNING_KEY"
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$SIGNING_KEY_PWD"
            cargo tauri build --target aarch64-apple-darwin
          else
            echo "Building unsigned bundles (SIGNING_KEY not set in secrets)..."
            cargo tauri build --target aarch64-apple-darwin --config '{"bundle":{"createUpdaterArtifacts":false},"plugins":{"updater":{"pubkey":""}}}'
          fi
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_KEY_PWD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Stage bundles
        run: |
          mkdir -p staging
          find src-tauri/target/aarch64-apple-darwin/release/bundle -name "*.dmg" -exec cp {} staging/notion-lite-arm64.dmg \;
          find src-tauri/target/aarch64-apple-darwin/release/bundle -name "*.app.tar.gz" -exec cp {} staging/notion-lite-macos-arm64.app.tar.gz \;
          find src-tauri/target/aarch64-apple-darwin/release/bundle -name "*.sig" -exec cp {} staging/ \; || true
          ls -lh staging/

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-macos-aarch64
          path: staging/
          if-no-files-found: error

  build-windows:
    name: Build — Windows x86_64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Windows system dependencies
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files\LLVM\bin\libclang.dll") {
            echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          } elseif (Test-Path "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64\bin\libclang.dll") {
            echo "LIBCLANG_PATH=C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64\bin" >> $env:GITHUB_ENV
          } else {
            choco install llvm --no-progress
            echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rel-windows-x86_64-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rel-windows-x86_64-

      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall --no-confirm tauri-cli@^2

      - name: Build bundles
        working-directory: src-tauri
        shell: bash
        run: |
          if [ -z "$LIBCLANG_PATH" ]; then
            if [ -f "C:/Program Files/LLVM/bin/libclang.dll" ]; then
              export LIBCLANG_PATH="C:/Program Files/LLVM/bin"
            elif [ -f "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Tools/Llvm/x64/bin/libclang.dll" ]; then
              export LIBCLANG_PATH="C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Tools/Llvm/x64/bin"
            fi
          fi
          echo "LIBCLANG_PATH: $LIBCLANG_PATH"
          if [ -n "$SIGNING_KEY" ]; then
            export TAURI_SIGNING_PRIVATE_KEY="$SIGNING_KEY"
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$SIGNING_KEY_PWD"
            cargo tauri build --target x86_64-pc-windows-msvc
          else
            echo "Building unsigned bundles (SIGNING_KEY not set in secrets)..."
            cargo tauri build --target x86_64-pc-windows-msvc --config '{"bundle":{"createUpdaterArtifacts":false},"plugins":{"updater":{"pubkey":""}}}'
          fi
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_KEY_PWD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Stage bundles
        shell: bash
        run: |
          mkdir -p staging
          find src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -name "*.exe" -exec cp {} staging/notion-lite-setup.exe \;
          find src-tauri/target/x86_64-pc-windows-msvc/release/bundle -name "*.sig" -exec cp {} staging/ \; || true
          find src-tauri/target/x86_64-pc-windows-msvc/release/bundle -name "*.zip*" -exec cp {} staging/ \; || true
          ls -lh staging/

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-windows-x86_64
          path: staging/
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────
  # 2. Generate CHANGELOG and publish the GitHub Release
  # ────────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [build-linux, build-macos-x64, build-macos-arm64, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history for changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate CHANGELOG since last release
        id: changelog
        run: |
          TAG="${{ steps.tag.outputs.version }}"
          # Find the previous tag (if any)
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1 || true)

          echo "## What's Changed in ${TAG}" > CHANGELOG_RELEASE.md
          echo "" >> CHANGELOG_RELEASE.md

          if [ -n "$PREV_TAG" ]; then
            echo "Full diff: [\`${PREV_TAG}...${TAG}\`](../../compare/${PREV_TAG}...${TAG})" >> CHANGELOG_RELEASE.md
            echo "" >> CHANGELOG_RELEASE.md

            # Categorise commits by conventional commit prefix
            for prefix in feat fix perf refactor docs chore; do
              commits=$(git log "${PREV_TAG}..HEAD" \
                --pretty=format:"- %s ([%h](../../commit/%H))" \
                --no-merges \
                | grep -i "^- ${prefix}" || true)
              if [ -n "$commits" ]; then
                case $prefix in
                  feat)     echo "### ✨ New Features" >> CHANGELOG_RELEASE.md ;;
                  fix)      echo "### 🐛 Bug Fixes"   >> CHANGELOG_RELEASE.md ;;
                  perf)     echo "### ⚡ Performance"  >> CHANGELOG_RELEASE.md ;;
                  refactor) echo "### ♻️ Refactor"     >> CHANGELOG_RELEASE.md ;;
                  docs)     echo "### 📚 Docs"         >> CHANGELOG_RELEASE.md ;;
                  chore)    echo "### 🔧 Chores"       >> CHANGELOG_RELEASE.md ;;
                esac
                echo "$commits" >> CHANGELOG_RELEASE.md
                echo "" >> CHANGELOG_RELEASE.md
              fi
            done

            # Remainder (uncategorised)
            OTHER=$(git log "${PREV_TAG}..HEAD" \
              --pretty=format:"- %s ([%h](../../commit/%H))" \
              --no-merges \
              | grep -viE "^- (feat|fix|perf|refactor|docs|chore)" || true)
            if [ -n "$OTHER" ]; then
              echo "### 📦 Other" >> CHANGELOG_RELEASE.md
              echo "$OTHER" >> CHANGELOG_RELEASE.md
              echo "" >> CHANGELOG_RELEASE.md
            fi
          else
            echo "_Initial release — no previous tag found._" >> CHANGELOG_RELEASE.md
            echo "" >> CHANGELOG_RELEASE.md
          fi

          echo "### 📥 Installation" >> CHANGELOG_RELEASE.md
          echo "" >> CHANGELOG_RELEASE.md
          echo "| Platform | Package |" >> CHANGELOG_RELEASE.md
          echo "|---|---|" >> CHANGELOG_RELEASE.md
          echo "| Ubuntu / Debian | \`.deb\` |" >> CHANGELOG_RELEASE.md
          echo "| Fedora / RHEL | \`.rpm\` |" >> CHANGELOG_RELEASE.md
          echo "| Any Linux (portable) | \`.AppImage\` |" >> CHANGELOG_RELEASE.md
          echo "| macOS (Intel) | \`.dmg\` (x86_64) |" >> CHANGELOG_RELEASE.md
          echo "| macOS (Apple Silicon) | \`.dmg\` (aarch64) |" >> CHANGELOG_RELEASE.md
          echo "| Windows | \`.exe\` (x64) |" >> CHANGELOG_RELEASE.md
          echo "" >> CHANGELOG_RELEASE.md
          echo "> ⚠️ This is an unofficial Notion client. Not affiliated with or endorsed by Notion Labs, Inc." >> CHANGELOG_RELEASE.md

          cat CHANGELOG_RELEASE.md

      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          path: release-assets/
          # Download all artifacts from this workflow run
          merge-multiple: true

      - name: List release assets
        run: find release-assets/ -type f | sort

      # Build compliant Debian/Ubuntu APT repository according to apt-packaging-guide.md
      - name: Build APT Repository
        run: |
          sudo apt-get update && sudo apt-get install -y dpkg-dev
          mkdir -p dist
          find release-assets -name "*.deb" -exec cp {} dist/ \;
          ./scripts/update-repo.sh apt-repo
          tar -czf release-assets/apt-repo.tar.gz -C apt-repo .
          cp scripts/setup.sh release-assets/

      # Generate SHA-256 checksums for all assets
      - name: Generate SHA-256 checksums
        run: |
          cd release-assets
          find . -maxdepth 1 -type f ! -name "SHA256SUMS.txt" -exec sha256sum {} + | sed 's|^\./||' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Generate latest.json for Tauri Updater
      - name: Generate latest.json
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          VERSION_CLEAN="${VERSION#v}"
          REPO_URL="https://github.com/${{ github.repository }}/releases/download/${VERSION}"
          
          # Find assets (AppImage for Linux, .app.tar.gz for macOS, .exe for Windows)
          LINUX_ASSET=$(find release-assets -name "*.AppImage" -printf "%f\n" | head -1)
          MACOS_X64_ASSET=$(find release-assets -name "*macos-x64.app.tar.gz" -printf "%f\n" | head -1)
          MACOS_ARM_ASSET=$(find release-assets -name "*macos-arm64.app.tar.gz" -printf "%f\n" | head -1)
          WINDOWS_ASSET=$(find release-assets -name "*.exe" -printf "%f\n" | head -1)

          # Get signatures (assuming .sig files are generated or using manual sha256 as fallback)
          # Note: Real production should use .sig files generated by tauri build
          get_sig() {
            if [ -f "release-assets/$1.sig" ]; then
              cat "release-assets/$1.sig"
            else
              echo "MISSING_SIGNATURE"
            fi
          }

          cat <<EOF > release-assets/latest.json
          {
            "version": "$VERSION_CLEAN",
            "notes": "Security hardening and updater integration.",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "linux-x86_64": {
                "signature": "$(get_sig $LINUX_ASSET)",
                "url": "$REPO_URL/$LINUX_ASSET"
              },
              "darwin-x86_64": {
                "signature": "$(get_sig $MACOS_X64_ASSET)",
                "url": "$REPO_URL/$MACOS_X64_ASSET"
              },
              "darwin-aarch64": {
                "signature": "$(get_sig $MACOS_ARM_ASSET)",
                "url": "$REPO_URL/$MACOS_ARM_ASSET"
              },
              "windows-x86_64": {
                "signature": "$(get_sig $WINDOWS_ASSET)",
                "url": "$REPO_URL/$WINDOWS_ASSET"
              }
            }
          }
          EOF
          cat release-assets/latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: "Notion Lite ${{ steps.tag.outputs.version }}"
          body_path: CHANGELOG_RELEASE.md
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.version, '-') }}
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}