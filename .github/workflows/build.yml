name: Build

# Builds all platform packages. Runs on every push/PR so we catch
# compilation regressions early, but artifact upload is cheap and
# gives us downloadable bundles for manual QA.
on:
  push:
    branches: [main, master, develop, rust-version]
    tags: ["v*", "[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
    branches: [main, master, develop, rust-version]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build — ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux ─────────────────────────────────────────────────
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            bundle_glob: |
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage

          # ── macOS ─────────────────────────────────────────────────
          - name: macOS x86_64 (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            platform: macos-x86_64
            bundle_glob: |
              src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

          - name: macOS aarch64 (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-aarch64
            bundle_glob: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

          # ── Windows ───────────────────────────────────────────────
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            bundle_glob: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── macOS deps ──────────────────────────────────────────────
      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        run: brew install hunspell llvm

      - name: Locate libclang (macOS)
        if: runner.os == 'macOS'
        run: |
          LLVM_LIB_DIR="$(brew --prefix llvm)/lib"
          echo "LLVM_LIB_DIR: $LLVM_LIB_DIR"
          ls -l "$LLVM_LIB_DIR/libclang.dylib"
          # Symlink to /usr/local/lib which is usually searched by dyld
          sudo mkdir -p /usr/local/lib
          sudo ln -sf "$LLVM_LIB_DIR/libclang.dylib" /usr/local/lib/libclang.dylib

      # ── Linux deps ──────────────────────────────────────────────
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libhunspell-dev \
            libclang-dev clang llvm \
            rpm

      # ── Windows deps ────────────────────────────────────────────
      - name: Install Windows system dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files\LLVM\bin\libclang.dll") {
            echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          } elseif (Test-Path "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64\bin\libclang.dll") {
            echo "LIBCLANG_PATH=C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64\bin" >> $env:GITHUB_ENV
          } else {
            choco install llvm --no-progress
            echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          }

      # ── Rust ────────────────────────────────────────────────────
      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ── Tauri CLI (cached via cargo-binstall for speed) ─────────
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Tauri CLI
        run: cargo binstall --no-confirm tauri-cli@^2

      # ── Sync version if building a tag ──────────────────────────
      - name: Sync version from tag
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const v = process.argv[1].replace(/^v/, "");
            if (/^\d+\.\d+\.\d+/.test(v)) {
              let c = fs.readFileSync("src-tauri/Cargo.toml", "utf8").replace(/^version = ".*?"/m, `version = "${v}"`);
              fs.writeFileSync("src-tauri/Cargo.toml", c);
              let t = fs.readFileSync("src-tauri/tauri.conf.json", "utf8").replace(/"version": ".*?"/, `"version": "${v}"`);
              fs.writeFileSync("src-tauri/tauri.conf.json", t);
              console.log("✓ Synced version to " + v);
            }
          ' "${{ github.event.inputs.tag || github.ref_name }}"

      # ── Build ───────────────────────────────────────────────────
      - name: Build Tauri bundles
        working-directory: src-tauri
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "macOS" ]; then
            export SDKROOT=$(xcrun --show-sdk-path)
            export LIBCLANG_PATH="$(brew --prefix llvm)/lib"
            echo "LIBCLANG_PATH: $LIBCLANG_PATH"
          elif [ "${{ runner.os }}" == "Windows" ]; then
            if [ -z "$LIBCLANG_PATH" ]; then
              if [ -f "C:/Program Files/LLVM/bin/libclang.dll" ]; then
                export LIBCLANG_PATH="C:/Program Files/LLVM/bin"
              elif [ -f "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Tools/Llvm/x64/bin/libclang.dll" ]; then
                export LIBCLANG_PATH="C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Tools/Llvm/x64/bin"
              fi
            fi
            echo "LIBCLANG_PATH: $LIBCLANG_PATH"
          else
            export LIBCLANG_PATH=$(llvm-config --libdir)
            echo "LIBCLANG_PATH: $LIBCLANG_PATH"
          fi
          IS_VALID_KEY=true
          if [ -n "$SIGNING_KEY" ]; then
            if echo "$SIGNING_KEY" | base64 -d 2>/dev/null | grep -qi "public key"; then
              echo "::warning::TAURI_SIGNING_PRIVATE_KEY appears to be a PUBLIC key (*.key.pub), not a PRIVATE key (*.key)! Please update the secret in GitHub repository settings."
              IS_VALID_KEY=false
            else
              echo "test" > __test_key.txt
              if ! cargo tauri signer sign --private-key "$SIGNING_KEY" --password "${SIGNING_KEY_PWD:-}" __test_key.txt >/dev/null 2>&1; then
                echo "::warning::TAURI_SIGNING_PRIVATE_KEY could not be decrypted with TAURI_SIGNING_PRIVATE_KEY_PASSWORD (wrong key or password). Please update your GitHub repository secrets! Building unsigned bundles..."
                IS_VALID_KEY=false
              fi
              rm -f __test_key.txt __test_key.txt.sig
            fi
          else
            IS_VALID_KEY=false
          fi

          if [ "$IS_VALID_KEY" = "true" ]; then
            export TAURI_SIGNING_PRIVATE_KEY="$SIGNING_KEY"
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$SIGNING_KEY_PWD"
            if ! cargo tauri build --target ${{ matrix.target }}; then
              echo "::warning::Tauri signed build failed. Falling back to unsigned build..."
              unset TAURI_SIGNING_PRIVATE_KEY
              unset TAURI_SIGNING_PRIVATE_KEY_PASSWORD
              cargo tauri build --target ${{ matrix.target }} --config '{"bundle":{"createUpdaterArtifacts":false},"plugins":{"updater":{"pubkey":""}}}'
            fi
          else
            echo "Building unsigned bundles (valid SIGNING_KEY not configured)..."
            cargo tauri build --target ${{ matrix.target }} --config '{"bundle":{"createUpdaterArtifacts":false},"plugins":{"updater":{"pubkey":""}}}'
          fi
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_KEY_PWD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # ── Collect bundles into a flat staging directory ───────────
      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p staging
          if [ "${{ runner.os }}" = "Linux" ]; then
            for deb in $(find src-tauri/target/${{ matrix.target }}/release/bundle -name "*.deb" 2>/dev/null); do
              echo "Sanitizing Debian package $deb (removing duplicate desktop file)..."
              tmp_extract=$(mktemp -d)
              dpkg-deb -R "$deb" "$tmp_extract"
              rm -f "$tmp_extract/usr/share/applications/Notion Lite.desktop"
              dpkg-deb -b "$tmp_extract" "$deb"
              rm -rf "$tmp_extract"
            done
          fi
          # Copy every bundle file (deb/rpm/AppImage/dmg/exe/msi) to staging/
          find src-tauri/target/${{ matrix.target }}/release/bundle \
            \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.exe" -o -name "*.msi" \) \
            -exec cp {} staging/ \;
          ls -lh staging/

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: notion-lite-${{ matrix.platform }}-${{ github.sha }}
          path: staging/
          retention-days: 14
          if-no-files-found: error
